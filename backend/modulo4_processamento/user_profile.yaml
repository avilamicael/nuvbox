      - "Aprendizado > Banco de Dados"
      - "Aprendizado > DevOps"

  pessoal:
    descricao: "Vida pessoal, saúde, lazer, relacionamentos, família, finanças"
    exemplos_topicos:
      - "Pessoal > Saúde"
      - "Pessoal > Família"
      - "Pessoal > Finanças"
      - "Pessoal > Lazer"
      - "Pessoal > Rotina"
      - "Pessoal > Reflexão"
      - "Pessoal > Amigos"

  ideias:
    descricao: "Ideias de produtos, funcionalidades, negócios, projetos futuros, insights"
    exemplos_topicos:
      - "Ideias > Cerebro > Nova Feature"
      - "Ideias > Cerebro > Monetização"
      - "Ideias > Cerebro > SaaS"
      - "Ideias > Produto"
      - "Ideias > Negócio"
