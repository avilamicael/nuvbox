# Módulo 0: User Profile & Context
# Perfil do usuário usado para contextualização em Módulo 4
# Formato: YAML | Linguagem: PT-BR
# Interface de edição disponível via Curadoria de Dados (tela Revisão)

usuario:
  nome: "Micael"
  idioma: "português"
  fuso_horario: "America/Sao_Paulo"
  ocupacao: >
    Desenvolvedor de software full-stack e arquiteto de sistemas.
    Criador do Cerebro/Cerebro — sistema de segunda memória pessoal por voz:
    captura áudio passivo, transcreve com Whisper, categoriza com LLM, armazena em PostgreSQL.
    Trabalha com Python (Flask, asyncio), React/Vite, Electron, Docker, PostgreSQL e OpenAI API.
    Constrói o sistema para uso pessoal primeiro, com visão de escalar para SaaS ou B2B.

# Projetos ativos — ajudam o LLM a entender contexto de termos técnicos
projetos_ativos:
  - nome: "Cerebro / Cerebro"
    descricao: >
      Sistema de segunda memória pessoal baseado em voz. Pipeline completo:
      captura de áudio → VAD (silero) → transcrição Whisper → processamento LLM (GPT-4o mini) →
      extração de entidades/tópicos/action items → armazenamento PostgreSQL → consulta por linguagem natural.
      Backend Python (Flask), frontend React (checklist + curadoria), módulos M0–M6 implementados.
      M7 (embeddings/busca semântica) é o próximo passo.
    tecnologias: [Python, Flask, PostgreSQL, Whisper, Docker, React, Vite, OpenAI]
    status: "em desenvolvimento ativo — M1 a M6 implementados, M7 em planejamento"

  - nome: "Pinky"
    descricao: >
      App Windows (Electron + TypeScript) que captura áudio do microfone, transcreve localmente
      com Whisper e envia para o backend Cerebro via webhook. Interface de bandeja do sistema.
      Funciona como o "sensor" de entrada do Cerebro no desktop.
    tecnologias: [Electron, TypeScript, React, Whisper, Node.js]
    status: "em desenvolvimento ativo"

  - nome: "Cerebro Checklist / Curadoria"
    descricao: >
      Frontend React do Cerebro com duas telas: (1) Checklist de progresso do projeto,
      (2) Curadoria de dados — revisão e correção de fragmentos, entidades, tópicos,
      tarefas e correções de transcrição (ex: "prômitos" → "prompts").
    tecnologias: [React, Vite, JavaScript]
    status: "implementado e em uso"

# Contextos de vida — usados para categorização de tópicos
# O LLM deve usar estes como referência, mas pode criar tópicos novos livremente
contextos:
  trabalho:
    descricao: "Desenvolvimento de software, arquitetura de sistemas, DevOps, planejamento técnico"
    exemplos_topicos:
      - "Trabalho > Cerebro > Backend"
      - "Trabalho > Cerebro > Backend > M4 Processamento"
      - "Trabalho > Cerebro > Backend > M5 Storage"
      - "Trabalho > Cerebro > Backend > M6 Consulta"
      - "Trabalho > Cerebro > Backend > M7 Embeddings"
      - "Trabalho > Cerebro > Frontend"
      - "Trabalho > Cerebro > Frontend > Curadoria"
      - "Trabalho > Cerebro > Bugs"
      - "Trabalho > Cerebro > Deploy"
      - "Trabalho > Cerebro > Arquitetura"
      - "Trabalho > Cerebro > Planejamento"
      - "Trabalho > Pinky > Audio"
      - "Trabalho > Pinky > Electron"
      - "Trabalho > Infraestrutura > Docker"
      - "Trabalho > Infraestrutura > PostgreSQL"
      - "Trabalho > Infraestrutura > Deploy"
      - "Trabalho > Planejamento"
      - "Trabalho > Code Review"
      - "Trabalho > Debugging"

  aprendizado:
    descricao: "Estudo de novas tecnologias, cursos, pesquisa técnica, leituras"
    exemplos_topicos:
