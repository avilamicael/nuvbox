  decisoes:
    descricao: "Decisões técnicas, arquiteturais ou pessoais tomadas"
    exemplos_topicos:
      - "Decisão > Cerebro > Arquitetura"
      - "Decisão > Cerebro > Tech Stack"
      - "Decisão > Pessoal"

# Tipos de entidade que o sistema deve extrair
# O LLM pode usar outros tipos se nenhum destes se encaixar
entidade_tipos:
  - "pessoa"       # Nomes de pessoas: amigos, colegas, clientes, influências
  - "empresa"      # Empresas, organizações: Google, Anthropic, OpenAI, cliente X
  - "projeto"      # Projetos de software ou pessoais: Cerebro, Pinky, App Mobile
  - "ferramenta"   # Tecnologias e ferramentas: Python, Docker, PostgreSQL, VSCode, Whisper
  - "conceito"     # Conceitos abstratos: embeddings, microserviços, VAD, RAG, fine-tuning
  - "lugar"        # Locais: São Paulo, escritório, café, país
  - "evento"       # Eventos: reunião, deadline, lançamento, apresentação, release
  - "decisao"      # Decisões tomadas: "vamos usar X", "decidimos que Y"
  - "produto"      # Produtos comerciais ou internos: SaaS, API, extensão Chrome

# Configuração de importância
importancia_config:
  threshold: 0.25

  # Critérios que elevam importância
  boost_contextos:
    "Trabalho": 0.10           # Tudo de trabalho é relevante
    "Trabalho > Cerebro": 0.20  # Conteúdo central do projeto principal
    "Ideias": 0.15             # Ideias têm alto valor como memória
    "Decisão": 0.20            # Decisões são críticas para rastrear

  boost_entidades:
    projeto:
      "Cerebro": 0.20
      "Pinky": 0.15
      "Cerebro": 0.20
    decisao: 0.20              # Decisões sempre são importantes
