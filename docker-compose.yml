services:
  postgres:
    image: postgres:15-alpine
    container_name: cerebro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-cerebro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cerebro}
      POSTGRES_DB: ${DB_NAME:-cerebro_db}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=pt_BR.UTF-8"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cerebro} -d ${DB_NAME:-cerebro_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cerebro-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cerebro-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-cerebro}
      DB_PASSWORD: ${DB_PASSWORD:-cerebro}
      DB_NAME: ${DB_NAME:-cerebro_db}
      # Microphone
      MIC_DEVICE_ID: ${MIC_DEVICE_ID:-0}
      MIC_SAMPLE_RATE: ${MIC_SAMPLE_RATE:-16000}
      MIC_CHUNK_SIZE: ${MIC_CHUNK_SIZE:-512}
      # Whisper
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-pt}
      # VAD
      VAD_SILENCE_DURATION_MS: ${VAD_SILENCE_DURATION_MS:-500}
      VAD_MIN_SPEECH_DURATION_MS: ${VAD_MIN_SPEECH_DURATION_MS:-300}
      # Flask
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5001
      CEREBRO_SECRET: ${CEREBRO_SECRET:-change_me_before_ngrok}
      # Logging
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # LLM / Módulo 4
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama-3.1-8b-instant}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_COST_INPUT_PER_1M: ${LLM_COST_INPUT_PER_1M:-0.0}
      LLM_COST_OUTPUT_PER_1M: ${LLM_COST_OUTPUT_PER_1M:-0.0}
      MODULO4_BATCH_SIZE: ${MODULO4_BATCH_SIZE:-15}
      MODULO4_POLL_INTERVAL_SECONDS: ${MODULO4_POLL_INTERVAL_SECONDS:-180}
      MODULO4_IMPORTANCE_THRESHOLD: ${MODULO4_IMPORTANCE_THRESHOLD:-0.25}
      MODULO4_DAILY_COST_LIMIT_USD: ${MODULO4_DAILY_COST_LIMIT_USD:-2.00}
      MODULO4_MAX_RETRIES: ${MODULO4_MAX_RETRIES:-3}
      MODULO4_DRY_RUN: ${MODULO4_DRY_RUN:-false}
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
      - /dev/snd:/dev/snd  # Audio device passthrough (Linux)
    ports:
      - "5001:5001"
    devices:
      - /dev/snd  # For microphone access
    networks:
      - cerebro-network

networks:
  cerebro-network:
    driver: bridge
